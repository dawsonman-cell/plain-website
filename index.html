<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plain Website — 主頁</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">Plain Website</a>
      <nav class="nav" aria-label="主選單">
        <a href="index.html" class="active">主頁</a>
        <a href="about.html">關於</a>
        <a href="contact.html">聯絡</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <p class="eyebrow">簡潔 · 清晰 · 靜態</p>
        <h1>歡迎來到 Plain Website</h1>
        <p class="lead">一個簡單、現代、無需框架的靜態網站。適合展示個人簡介或小型專案。</p>
        <div class="actions">
          <a class="btn primary" href="about.html">了解更多</a>
          <a class="btn secondary" href="contact.html">聯絡我們</a>
        </div>
      </div>
    </section>

    <section class="features">
      <div class="container">
        <h2>特色</h2>
        <div class="card-grid">
          <article class="card">
            <h3>簡潔設計</h3>
            <p>乾淨排版與舒適閱讀體驗，專注內容本身。</p>
          </article>
          <article class="card">
            <h3>回應式</h3>
            <p>在手機、平板與桌面均能良好顯示。</p>
          </article>
          <article class="card">
            <h3>純靜態</h3>
            <p>純 HTML 與 CSS，無需建置步驟或框架。</p>
          </article>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Plain Website · Dawson</p>
    </div>
  </footer>
</body>
</html>
